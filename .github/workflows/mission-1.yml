name: EHJINT Mission 1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Bootstrap pinned public toolchain
        shell: bash
        run: ./scripts/bootstrap-tools.sh
      - name: Run canonical Mission 1 gate
        shell: bash
        run: ./scripts/check.sh
